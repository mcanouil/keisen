name: Release

# Writes the next version on main, drafts the GitHub Release, and opens the
# Typst Universe pull request after approval on the typst-universe environment.
# Run Publish once Typst Universe serves the version.
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: "Version bump, or none to resubmit the current draft"
        default: "minor"
        options:
          - "patch"
          - "minor"
          - "major"
          - "none"
      dry-run:
        type: boolean
        description: "Rehearse: push nothing, draft nothing, open no pull request"
        default: false

permissions:
  contents: read

# One release at a time, and never cancelled: a run stopped part way could
# leave the bump on main with no draft behind it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: mcanouil/typst-workflows/.github/workflows/release.yml@v2
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}
      dry-run: ${{ inputs.dry-run }}
      targets: |
        - file: CITATION.cff
          pattern: '^version: {version}$'
        - file: CITATION.cff
          pattern: '^date-released: "{date}"$'
          required: false
        - file: README.md
          pattern: '@preview/keisen:{version}'
      # The citation has no date-released before the first release, and the
      # bump replaces lines but never adds them, so the first bump adds it here.
      after-bump: |
        if ! grep -q '^date-released:' CITATION.cff; then
          version="$(awk -F'"' '/^version = / { print $2; exit }' typst.toml)"
          date="$(sed -n "s/^## ${version} (\(.*\))\$/\1/p" CHANGELOG.md)"
          sed -i "/^version: /a date-released: \"${date}\"" CITATION.cff
        fi
        tools/version-check.sh
      needs-quarto: true
      shellcheck-paths: "tools/*.sh docs/_scripts/*.sh"
      shfmt-paths: "tools/*.sh"
