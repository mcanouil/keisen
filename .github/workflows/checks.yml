name: Checks

# Everything tools/check.sh runs: the import boundary, the empty-module and
# fitted-page guards, the unit tests, the expect-fail suite, the probes, the
# visual tests and the examples.
#
# Until this workflow existed, the only check on a pull request was the Pages
# render, so a green tick meant the documentation site built and said nothing
# about the package.
#
# The two path lists are the same list written twice: GitHub Actions does not
# honour YAML anchors, so they must be kept in step by hand.
#
# `**` is what crosses a directory separator; a bare `*` does not. The pages
# moved into sections, so `docs/*.qmd` reached two of twenty-five and every
# listing under docs/examples and docs/reference went unchecked.
#
# Three things under docs are read by the suite, and they are named one by one
# rather than as a blanket `docs/**`, which would start three jobs on a Quarto
# setting nothing here compiles:
#
#   - the pages, whose import lines tools/version-check.sh and
#     tools/dry-release.sh compile;
#   - docs/_scripts, which the lint job below runs shellcheck over;
#   - docs/assets, which tools/check.sh holds to the visual tests that render
#     it. Without this a pull request editing an image alone would skip the
#     check that reads it.
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "lib.typ"
      - "tests/**"
      - "examples/**"
      - "tools/**"
      - "typst.toml"
      - "docs/**.qmd"
      - "docs/_scripts/**.sh"
      - "docs/assets/**"
      - "README.md"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - ".github/workflows/checks.yml"
  pull_request:
    # The default activity types fire nothing when a pull request leaves draft,
    # so `ready_for_review` is what runs the suite once the draft is lifted.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "lib.typ"
      - "tests/**"
      - "examples/**"
      - "tools/**"
      - "typst.toml"
      - "docs/**.qmd"
      - "docs/_scripts/**.sh"
      - "docs/assets/**"
      - "README.md"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: read

# One active run per ref; a superseded run on a pull request tells nobody
# anything.
#
# A push to main is not superseded by the next push to main: both are commits
# that must be shown to build. The ref is the same for every one of them, so
# grouping on it threw away the verification of a commit that stays on main for
# good.
#
# Asking for cancellation on pull requests alone is not enough to fix that. A
# group admits one pending run, so a third push cancels the second while it
# waits, whatever cancel-in-progress says. The group itself is therefore the
# commit outside a pull request, which puts each one in a group of its own and
# leaves nothing to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: Compile the suite
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Typst version from typst.toml
        id: typst-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^compiler[[:space:]]*=/ { print $2; exit }' typst.toml)"
          [[ -n "${version}" ]] || { echo "::error::compiler not found in typst.toml"; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      # tools/quarto-check.sh renders a table through Quarto's Typst path, and
      # fails rather than skips when Quarto is absent, so the suite needs it
      # here. The script points Quarto at the Typst installed above, since the
      # one Quarto carries is older than typst.toml requires.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2.2.0

      # No font is installed, and none is needed. Typst carries Libertinus Serif
      # among the four families it embeds, which is the one the visual tests
      # name, so the runner renders what the author's machine renders rather
      # than falling back to something else. `typst fonts --ignore-system-fonts`
      # lists the four.
      #
      # This comment used to say the opposite, and a review took it at its word
      # and concluded that no check could compare a render across machines.
      - name: Run the checks
        run: tools/check.sh

  package:
    name: Compile from the staged package
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Typst version from typst.toml
        id: typst-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^compiler[[:space:]]*=/ { print $2; exit }' typst.toml)"
          [[ -n "${version}" ]] || { echo "::error::compiler not found in typst.toml"; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      # A module that no package specification can reach compiles from the
      # working tree and fails for everyone who installs it, which is how an
      # unreachable nanoplot module reached the documentation. Staging and
      # importing through @preview is the only check that sees it, and the
      # documentation's own listings are where that import is printed.
      #
      # The same script the author runs, pointed at the runner's temporary
      # directory instead of a home one. Its manifest lint is skipped here,
      # since typst-package-check is not installed on the runner.
      - name: Rehearse the release
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}
          STAGE_ROOT: ${{ runner.temp }}/stage
        run: tools/dry-release.sh

  lint:
    name: Lint the shell scripts
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # shellcheck ships with the runner image; shfmt does not.
      - name: Install shfmt
        shell: bash
        run: |
          set -euo pipefail
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          printf '%s/bin\n' "$(go env GOPATH)" >> "${GITHUB_PATH}"

      - name: Run shellcheck
        run: shellcheck tools/*.sh docs/_scripts/*.sh

      # Formatting is checked on this repository's own scripts alone. The two
      # under docs/_scripts come from the site scaffold and keep its tab
      # indentation; reformatting them here would only diverge from the source
      # they are regenerated from. shellcheck above covers them either way.
      - name: Run shfmt
        run: shfmt -d tools/*.sh
