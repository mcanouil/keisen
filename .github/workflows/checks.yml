name: Checks

# Runs the shared checks from mcanouil/typst-workflows: tools/check.sh, the
# release rehearsal in tools/dry-release.sh with its manifest lint, and the
# shell lint.
#
# The two path lists are the same list written twice: GitHub Actions does not
# honour YAML anchors, so they must be kept in step by hand.
#
# `**` is what crosses a directory separator; a bare `*` does not.
#
# Three things under docs are read by the suite, and they are named one by one
# rather than as a blanket `docs/**`:
#
#   - the pages, whose import lines tools/version-check.sh and
#     tools/dry-release.sh compile, and whose `//| file:` blocks tools/check.sh
#     resolves against the visual tests;
#   - docs/_scripts, which the lint job runs shellcheck over;
#   - docs/_filters, whose import filter tools/check.sh runs on a listing.

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "lib.typ"
      - "tests/**"
      - "examples/**"
      - "tools/**"
      - "typst.toml"
      - "docs/**.qmd"
      - "docs/_scripts/**.sh"
      # tools/check.sh runs the filter that writes the package import on the site.
      - "docs/_filters/**"
      # tools/version-check.sh reads both, holding the one-line description in
      # every place it is written to the manifest's.
      - "docs/_quarto.yml"
      - "docs/site.webmanifest"
      - "README.md"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - ".editorconfig"
      - ".github/workflows/checks.yml"
  pull_request:
    # Drafts start no job. Leaving draft runs the suite once.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "lib.typ"
      - "tests/**"
      - "examples/**"
      - "tools/**"
      - "typst.toml"
      - "docs/**.qmd"
      - "docs/_scripts/**.sh"
      # tools/check.sh runs the filter that writes the package import on the site.
      - "docs/_filters/**"
      # tools/version-check.sh reads both, holding the one-line description in
      # every place it is written to the manifest's.
      - "docs/_quarto.yml"
      - "docs/site.webmanifest"
      - "README.md"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - ".editorconfig"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: read

# One active run per ref; a superseded run on a pull request tells nobody
# anything.
#
# A push to main is not superseded by the next push to main: both are commits
# that must be shown to build. The ref is the same for every one of them, so
# grouping on it threw away the verification of a commit that stays on main for
# good.
#
# Asking for cancellation on pull requests alone is not enough to fix that. A
# group admits one pending run, so a third push cancels the second while it
# waits, whatever cancel-in-progress says. The group itself is therefore the
# commit outside a pull request, which puts each one in a group of its own and
# leaves nothing to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: mcanouil/typst-workflows/.github/workflows/checks.yml@v1
    with:
      needs-quarto: true
      shellcheck-paths: "tools/*.sh docs/_scripts/*.sh"
      shfmt-paths: "tools/*.sh"
