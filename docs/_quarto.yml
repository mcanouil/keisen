project:
  type: atelier
  # Generates changelog.qmd from CHANGELOG.md and _variables.yml from the
  # project's version, and removes both afterwards. The leading ./ is required;
  # a bare name fails to spawn. The scripts live in _scripts/, whose leading
  # underscore keeps Quarto from treating it as content.
  pre-render:
    - ./_scripts/pre-render.sh
  post-render:
    - ./_scripts/post-render.sh
    - ./_scripts/typst-render-check.sh
  # Quarto copies nothing to the output directory by convention: only these
  # globs, plus files it finds behind an `href` or `src` in the rendered HTML.
  # The manifest names its icons in JSON, which is not scanned, so they are
  # listed here. The social card is not: Quarto registers a project-relative
  # `website.image` as a resource itself.
  resources:
    - favicon.ico
    - site.webmanifest
    - assets/icons/*.png

website:
  title: "Keisen"
  description: "Create elegant display tables from tabular data."
  # No trailing slash: Quarto builds the social image URL by concatenating this
  # with a leading-slash image path, without normalising.
  site-url: &site-url https://m.canouil.dev/keisen
  repo-url: https://github.com/mcanouil/keisen
  # The Quarto project root is `docs/`, so without this every edit and issue
  # link points at a path one level up from the page it was built for.
  repo-subdir: docs
  favicon: favicon.ico
  # The leading slash marks a project-relative path, which Quarto turns into
  # `<site-url>/assets/social/og-image.png` and measures to fill the image width
  # and height tags. An absolute URL would emit neither: Quarto returns no size
  # for one, then writes that over whatever the configuration set.
  # _scripts/pre-render.sh writes the file, from GitHub's own preview for this
  # repository; see assets/social/README.md.
  image: /assets/social/og-image.png
  image-alt: "GitHub's repository card for mcanouil/keisen: the repository name and its one-line description beside the owner's avatar, over the contributor, issue, star, and fork counts."
  page-navigation: true
  # A section is a set of pages, so a reader reaching the end of one wants the
  # next rather than the sidebar they came from, and a reader at the foot of a
  # long reference page wants the top.
  back-to-top-navigation: true
  # No `search` block: atelier already puts the search in the navbar, as an
  # overlay opened from a button. The sidebars therefore carry no search field of
  # their own, so the site offers one way in rather than two.
  #
  # The two levels of navigation divide by kind, not by depth. The navbar names
  # the sections and carries the tools; each section's own sidebar carries the
  # pages inside it, and is where a new page goes. Repeating a page in both only
  # makes the reader wonder which one is which, so a section's index page is a
  # navbar item and appears in no sidebar.
  #
  # The sidebars themselves are declared one file per section, in
  # _sidebar-reference.yml and _sidebar-examples.yml, and pulled in through
  # `metadata-files` below. A page joins a section by naming that sidebar's id in
  # the section's _metadata.yml.
  navbar:
    pinned: true
    # Labels are plain text. An iconify shortcode does expand here, unlike in a
    # sidebar item, but a navbar that mixes glyph-and-word items with bare words
    # reads as an accident; glyphs belong in the footer and on the tools.
    left:
      - href: index.qmd
        text: "Home"
      - href: reference/index.qmd
        text: "Reference"
      - href: examples/index.qmd
        text: "Examples"
      - href: gallery/index.qmd
        text: "Gallery"
      - href: changelog.qmd
        text: "Changelog"
    right:
      # The version switcher script replaces the placeholder below with one
      # entry per version, read from the site-root versions.json.
      - text: "{{< env VERSION >}}"
        menu:
          - text: "Versions"
            href: "#version-switcher"
      # The gitlink widget replaces this item wholesale, so the `text` and `icon`
      # here are only what a reader sees if the filter never runs.
      - href: "#gitlink-widget"
        text: "GitHub"
        icon: github
  page-footer:
    left: |
      Powered by [{{< iconify simple-icons:quarto aria-hidden='true' >}} Quarto](https://quarto.org).
    center: |
      &copy; []{#current-year} [Mickaël Canouil](https://mickael.canouil.fr). [{{< iconify octicon:heart-fill-16 aria-hidden='true' >}} Sponsor](https://github.com/sponsors/mcanouil?o=esb).
    right: |
      Licence: [MIT](https://github.com/mcanouil/keisen?tab=MIT-1-ov-file#readme).

# One sidebar per section, each in a file of its own. Quarto merges these into
# the configuration above, which is the only way to declare more than one
# sidebar; a second `website.sidebar` block here would replace the first.
metadata-files:
  - _sidebar-reference.yml
  - _sidebar-examples.yml
  - _sidebar-gallery.yml

filters:
  # Before code-window, so the source typst-render echoes gets its window.
  - typst-render
  # Rewrites the "/lib.typ" import in the listings typst-render echoes, in
  # place, so it runs after typst-render. code-window runs earlier, in its own
  # pre-quarto pass, and wraps the listing without hiding it.
  # _scripts/typst-render-check.sh fails a render whose listing still shows
  # "/lib.typ".
  - _filters/package-import.lua
  - code-window
  - gitlink

extensions:
  # Quarto keeps the `website` block out of the metadata it hands to Lua
  # filters, so the social-metadata filter cannot read `website.site-url` to
  # build `og:url` and the canonical link. The anchor above republishes the same
  # scalar here, without a second copy of the string.
  atelier:
    site-url: *site-url
    # `website.favicon` covers `rel="icon"` alone. These three have no
    # configuration key of their own, so the social-metadata filter emits them.
    # Each path is written relative to the site root; the filter leaves it
    # exactly as it stands, because Quarto's resource resolver already prefixes
    # every `link[href]` with the page's own offset.
    icon: assets/icons/icon.svg
    apple-touch-icon: assets/icons/apple-touch-icon.png
    manifest: site.webmanifest
    # No `theme-color`: the filter falls back to the brand background of each
    # mode, which is the colour the page is actually painted with.
  gitlink:
    # Widget only: the platform and repository come from `website.repo-url`, and
    # in-text reference rewriting stays off so prose is left alone.
    enabled: false
    widget:
      enabled: true
      extra-links:
        - text: "Ideas"
          href: "/discussions/categories/ideas"
          icon: discussion
        - text: "Q&A"
          href: "/discussions/categories/q-a"
          icon: question
      # Quoted, like every other placeholder here: a bare %% starts a YAML
      # directive, and this file is parsed as it stands when the extensions
      # under _extensions/ are updated in place.
      sponsor: "mcanouil"
      # The widget sits in the navbar beside Quarto's search button and
      # colour-scheme toggle, so those two take its bordered pill as well;
      # left at the default they would sit next to it as plain glyphs.
      style-navbar-tools: true
  # Every table on the site is compiled from the visual test the page shows,
  # with `//| file:`. A leading slash is the docs project, so the root is the
  # repository: a test imports "/lib.typ" from there, and reads another by its
  # path, as anatomy.typ reads /tests/visual/grouped.typ. The images stay light,
  # on white, as the tests draw them.
  typst-render:
    root: "/.."
    # One directory for every page, ignored by git, whatever the page depth.
    output-directory: "/assets/typst-render"
    background: "#ffffff"
    width: auto
    height: auto
    margin: 0pt
    # Off: the cache key hashes local imports, but resolves each nested import
    # against the root, and the modules under src/ import one another by
    # relative paths, so an edit under src/ would keep serving old tables.
    cache: false
  code-window:
    style: "macos"
    # Blocks here are configuration to copy rather than files to save, so a
    # filename derived from the language would only add noise.
    auto-filename: false

# Ink on paper, ruled in blue, with vermilion for what must stand out: the
# palette the package itself is named after.
brand: _brand.yml

format:
  # Configure the extension format by name. Declaring `html` would replace
  # `atelier-html` rather than configure it, silently dropping the theme, the
  # bundled scripts, and the social-metadata filter.
  atelier-html:
    # assets/theme.scss stays last, so it wins the cascade over the brand.
    theme:
      light:
        - brand
        - assets/theme.scss
      dark:
        - brand
        - assets/theme.scss
    include-after-body:
      - file: assets/scripts/version-switcher.html
